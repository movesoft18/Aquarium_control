services:
  db:
    image: mysql:8.0
    container_name: aquarium-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${MYSQL_USER}", "-p${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    container_name: aquarium-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      JWT_EXPIRES_MINUTES: ${JWT_EXPIRES_MINUTES}
      API_KEY_PEPPER: ${API_KEY_PEPPER}
      LOG_LEVEL: ${LOG_LEVEL}
    expose:
      - "8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  nginx:
    image: nginx:alpine
    container_name: aquarium-nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  simulator:
    build: .
    container_name: aquarium-simulator
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      AQUA_API_URL: http://api:8000/api/v1
      AQUA_DEVICE_ID: ${AQUA_DEVICE_ID}
      AQUA_API_KEY: ${AQUA_API_KEY}
      AQUA_INTERVAL: ${AQUA_INTERVAL}
      AQUA_SCENARIO: ${AQUA_SCENARIO}
    command: ["python", "-m", "emulator.device_sim"]

volumes:
  mysql_data: