[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aquarium-api"
version = "0.1.0"
description = "API системы «Аквариум с удалённым доступом и мониторингом»"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pymysql>=1.1",
    "pydantic[email]>=2.6",
    "pydantic-settings>=2.2",
    "passlib[bcrypt]>=1.7",
    "bcrypt==4.0.1",
    "python-jose[cryptography]>=3.3",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "sqlalchemy-utils>=0.41",
]

# Явно указываем, какие пакеты собирать.
# venv (aqua) и прочие каталоги в сборку не попадают.
[tool.setuptools.packages.find]
include = ["app*", "emulator*"]
exclude = ["aqua*", "tests*", "alembic*"]

# Если нужны не-Python файлы внутри пакетов (например, шаблоны),
# их можно перечислить здесь. Для нашего проекта не требуется.
[tool.setuptools.package-data]
"*" = ["*.txt", "*.json", "*.yaml", "*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]